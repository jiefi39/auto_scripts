name: 🔄 Zampto Auto-stan Renew-stan

on:
  schedule:
    - cron: '45 00 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: Zampto_Renew-stan
      # 手动触发不取消正在跑的 run：新 run 排队等待，避免打断续期/签到半路
      cancel-in-progress: false
    env:
      #格式:email,password,tg_token,tg_chat
      ZAMPTO_BATCH: ${{ secrets.ZAMPTO_BATCH_STAN }}
      # 支持协议: vless, vmess, trojan, ss, hy2, tuic, anytls, socks5
      PROXY_CONTENT: ${{ secrets.ZAMPTO_HY2_PROXY_URL }}
      SOCKS_PORT: ${{ secrets.SOCKS_PORT || '10808' }}
      SCREENSHOT_DIR: screenshots
      PROJECT_DIR: zampto-stan
      PRIVATE_REPO: doraemon6789/auto_zampto_private
      # hCaptcha 图片挑战视觉兜底（glm-4v-flash，免费 key；CLIP 解不了的常识题走这里）
      ZAMPTO_VISION_KEY: ${{ secrets.ZAMPTO_VISION_KEY }}

    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 创建输出目录
        run: mkdir -p ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 CLIP 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/zampto_clip
          key: zampto-clip-v1

      - name: 安装系统依赖
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb fonts-noto-cjk

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install seleniumbase>=4.25.0 pyvirtualdisplay>=3.0 requests>=2.31.0
          fi
          # reCAPTCHA 语音挑战：识别 + 静态 ffmpeg（不装 apt 那一大坨）
          # audioop 在 Python 3.11 里还在标准库，audioop-lts 只给 3.13+ 用，别装
          pip install 'SpeechRecognition>=3.17.0' 'imageio-ffmpeg>=0.5,<1'
          # hCaptcha 图片挑战本地 CLIP 分类
          pip install 'onnxruntime>=1.17.0' 'pillow>=10.0.0' 'numpy>=1.26.0'

      - name: 安装代理
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: |
          if [ -z "$PROXY_CONTENT" ]; then
            echo "[INFO] 未配置代理，直连模式"
            exit 0
          fi

          SB_VER="1.13.14"
          ARCHIVE="sing-box-${SB_VER}-linux-amd64.tar.gz"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/${ARCHIVE}"
          tar -xzf "$ARCHIVE" -C /tmp/
          mv "/tmp/sing-box-${SB_VER}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          rm -rf "/tmp/sing-box-${SB_VER}-linux-amd64" "$ARCHIVE"
          echo "[INFO] sing-box $(./sing-box version | head -1)"

      - name: 随机延迟
        run: |
          delay=$((RANDOM % 120))
          echo "随机延迟: ${delay}秒"
          sleep $delay

      - name: 执行续期
        working-directory: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}
        run: python zampto-renew.py

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zampto-screenshots-${{ github.run_id }}
          path: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}
          retention-days: 7
          if-no-files-found: warn

      - name: 清理本地截图
        if: always()
        run: |
          SCREENSHOT_PATH="${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.PROJECT_DIR }}/${{ env.SCREENSHOT_DIR }}"
          if [ -d "$SCREENSHOT_PATH" ]; then
            rm -rf "$SCREENSHOT_PATH"/*
            echo "本地截图已清理"
          fi

      - name: 提交执行时间
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ${{ env.PROJECT_DIR }} && echo "$(date +'%Y-%m-%d %H:%M:%S')" > ${{ env.PROJECT_DIR }}/time.txt
          git add ${{ env.PROJECT_DIR }}/time.txt 2>/dev/null || true
          # 并发安全提交：每次以最新远端为基准重建提交，重试 3 次；
          # 最终失败只告警不让 run 变红（time.txt 仅为保活元数据）
          for _try in 1 2 3; do
            git fetch origin main
            git reset --soft FETCH_HEAD
            git commit -m "更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            if git push origin HEAD:main; then
              echo "执行时间已提交"
              exit 0
            fi
            echo "第 $_try 次推送冲突，重取远端后重试"
            sleep 3
          done
          echo "::warning::time.txt 3 次推送均失败，本次未更新（不影响本次执行结果）"

      - name: 清理旧运行
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 7
          keep_minimum_runs: 5

